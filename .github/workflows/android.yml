name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Engine unit tests
        run: ./gradlew :engine:test

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Render demo WAV
        run: ./gradlew :engine:renderDemoWav

      - uses: actions/upload-artifact@v4
        with:
          name: ekifu-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: demo-wav
          path: engine/build/demo.wav

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: engine/build/reports/tests/
